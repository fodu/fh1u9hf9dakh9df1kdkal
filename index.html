```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORDEM — BioLink</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --card: #111111;
      --card-hover: #181818;
      --text: #ffffff;
      --muted: #8d8d8d;
      --border: #252525;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #202020 0%, #080808 42%),
        var(--bg);

      display: flex;
      justify-content: center;
      padding: 35px 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    /* PERFIL */

    .profile {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 95px;
      height: 95px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 28px;

      background: linear-gradient(145deg, #242424, #0d0d0d);
      border: 1px solid #333;

      font-size: 42px;
      font-weight: 900;

      box-shadow: 0 15px 45px rgba(0,0,0,.5);
    }

    h1 {
      font-size: 38px;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    .username {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 15px;
    }

    .bio {
      color: #c5c5c5;
      line-height: 1.6;
      font-size: 14px;
    }

    /* LINKS */

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      min-height: 68px;

      display: flex;
      align-items: center;

      padding: 12px 16px;

      border: 1px solid var(--border);
      border-radius: 17px;

      background: rgba(17,17,17,.85);

      color: white;
      text-decoration: none;

      transition: .2s ease;
    }

    .link:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
      border-color: #444;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .icon {
      width: 43px;
      height: 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 14px;

      border-radius: 13px;
      background: #202020;

      font-size: 18px;
    }

    .link-content {
      flex: 1;
    }

    .link-title {
      display: block;
      font-size: 15px;
      font-weight: bold;
    }

    .link-description {
      display: block;
      margin-top: 4px;

      color: var(--muted);
      font-size: 12px;
    }

    .arrow {
      color: #777;
      font-size: 20px;

      transition: .2s;
    }

    .link:hover .arrow {
      transform: translateX(4px);
      color: white;
    }

    /* REDES */

    .socials {
      display: flex;
      justify-content: center;
      gap: 10px;

      margin-top: 25px;
    }

    .social {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: #111;
      color: white;

      text-decoration: none;
      font-size: 12px;
      font-weight: bold;

      transition: .2s;
    }

    .social:hover {
      transform: translateY(-3px);
      background: #202020;
    }

    footer {
      text-align: center;

      margin-top: 28px;

      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @media(max-width: 450px) {
      body {
        padding-top: 20px;
      }

      h1 {
        font-size: 34px;
      }

      .logo {
        width: 82px;
        height: 82px;
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- PERFIL -->

    <section class="profile">

      <div class="logo">
        O
      </div>

      <h1>ORDEM</h1>

      <p class="username">
        @ordem
      </p>

      <p class="bio">
        Um grupo. Uma identidade. Uma direção.<br>
        Bem-vindo à ORDEM.
      </p>

    </section>


    <!-- LINKS -->

    <section class="links">

      <a
        class="link"
        href="https://discord.com/"
        target="_blank"
      >

        <div class="icon">
          ◈
        </div>

        <div class="link-content">

          <span class="link-title">
            Discord
          </span>

          <span class="link-description">
            Entre na nossa comunidade
          </span>

        </div>

        <span class="arrow">
          →
        </span>

      </a>


      <a
        class="link"
        href="#"
        onclick="copiarConvite(event)"
      >

        <div class="icon">
          ↗
        </div>

        <div class="link-content">

          <span class="link-title">
            Convite da ORDEM
          </span>

          <span class="link-description">
            Convide seus amigos
          </span>

        </div>

        <span class="arrow">
          →
        </span>

      </a>


      <a
        class="link"
        href="#"
        target="_blank"
      >

        <div class="icon">
          ◎
        </div>

        <div class="link-content">

          <span class="link-title">
            Instagram
          </span>

          <span class="link-description">
            Siga a ORDEM
          </span>

        </div>

        <span class="arrow">
          →
        </span>

      </a>


      <a
        class="link"
        href="#"
        target="_blank"
      >

        <div class="icon">
          ▶
        </div>

        <div class="link-content">

          <span class="link-title">
            YouTube
          </span>

          <span class="link-description">
            Conteúdo e novidades
          </span>

        </div>

        <span class="arrow">
          →
        </span>

      </a>

    </section>


    <!-- REDES SOCIAIS -->

    <div class="socials">

      <a class="social" href="#">
        IG
      </a>

      <a class="social" href="#">
        YT
      </a>

      <a class="social" href="#">
        TK
      </a>

      <a class="social" href="#">
        DC
      </a>

    </div>


    <footer>
      ORDEM • 2026
    </footer>

  </main>


  <script>

    function copiarConvite(event) {

      event.preventDefault();

      const convite =
        "https://discord.com/invite/SEU-CONVITE";

      navigator.clipboard.writeText(convite);

      const titulo =
        event.currentTarget.querySelector(".link-title");

      const textoOriginal =
        titulo.innerText;

      titulo.innerText =
        "Convite copiado!";

      setTimeout(() => {

        titulo.innerText =
          textoOriginal;

      }, 1500);

    }

  </script>

</body>
</html>
```
